name: Release
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: zenbi-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Publish a validated version once
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const sha = context.payload.workflow_run.head_sha;
            const head = await github.rest.repos.getBranch({...repo, branch: 'main'});
            if (head.data.commit.sha !== sha) {
              core.info('A newer commit is on main; wait for its validation.');
              return;
            }
            const manifestFile = await github.rest.repos.getContent({
              ...repo, path: 'custom_components/zenbi/manifest.json', ref: sha
            });
            const manifest = JSON.parse(Buffer.from(manifestFile.data.content, 'base64').toString('utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
              core.info('Only stable versions are published.');
              return;
            }
            const version = manifest.version.replace(/\.0$/, '');
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} is already published; existing releases are never moved.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let body;
            try {
              const notes = await github.rest.repos.getContent({
                ...repo, path: `docs/releases/${tag}.md`, ref: sha
              });
              body = Buffer.from(notes.data.content, 'base64').toString('utf8');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const release = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: sha, name: `v.${version}`,
              body, generate_release_notes: !body, draft: false, prerelease: false,
              make_latest: 'true'
            });
            core.info(`Published ${release.data.html_url}`);
